services:
  app:
    container_name: node-app
    build:
      context: .
      dockerfile: ./Docker/Node/Dockerfile
    volumes:
      - ./Application:/app/Application
      - node_modules:/app/node_modules
    ports:
      - "80:3000"

  api:
    container_name: api_crypto
    build:
      context: .
      dockerfile: ./Docker/API/Dockerfile
    volumes:
      - ./Api:/app/Api
      - ./test-listings.html:/app/test-listings.html
      - ./blockchain-test.html:/app/blockchain-test.html
    ports:
      - "81:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - BLOCKCHAIN_RPC=http://ganache:8545
    depends_on:
      db:
        condition: service_healthy
      ganache:
        condition: service_started

  db:
    image: postgres:16
    container_name: postgres-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: onlycode-admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Zongo94
    volumes:
      - ./Docker/PgAdmin/servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on: 
      db:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-database
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  ganache:
    image: trufflesuite/ganache:latest
    container_name: ganache-blockchain
    ports:
      - "8545:8545"
    command: 
      - --deterministic
      - --accounts=10
      - --defaultBalanceEther=1000
      - --networkId=1337
      - --host=0.0.0.0
    restart: unless-stopped
      
volumes:
  node_modules:
  postgres_data:
  qdrant_data: