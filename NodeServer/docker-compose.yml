services:
  frontend:
    container_name: cryptocampus-frontend
    build:
      context: ./Application/Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    container_name: cryptocampus-api
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - /app/node_modules
      - ./uploads:/app/uploads
    ports:
      - "81:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: 5432
      BLOCKCHAIN_RPC: http://ganache:8545
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      QDRANT_URL: http://qdrant:6333
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      ganache:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: postgres-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Docker/PgAdmin/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ./Docker/PgAdmin/servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-database
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  ganache:
    image: trufflesuite/ganache:latest
    container_name: ganache-blockchain
    ports:
      - "8545:8545"
    command:
      - --deterministic
      - --accounts=10
      # Le compte d'indice 0 sert de trésorerie : il finance chaque nouveau tuteur (1000
      # CCT) et reçoit les achats boutique. Un solde de départ élevé lui évite de manquer
      # de fonds au fil des inscriptions (aucun impact réel, chaîne de dev locale).
      - --defaultBalanceEther=1000000
      - --networkId=1337
      - --host=0.0.0.0
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
