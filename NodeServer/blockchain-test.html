<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Blockchain Ganache</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        h2 {
            color: #764ba2;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .account-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
            transition: all 0.3s;
        }
        
        .account-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .account-index {
            font-weight: bold;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .account-address {
            font-family: monospace;
            font-size: 0.85em;
            color: #555;
            word-break: break-all;
            margin: 5px 0;
        }
        
        .account-balance {
            font-size: 1.3em;
            font-weight: bold;
            color: #28a745;
            margin-top: 10px;
        }
        
        .transaction-form {
            display: grid;
            gap: 15px;
            max-width: 600px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        
        input, select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .result {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
        }
        
        .result pre {
            background: white;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
        }
        
        .error {
            background: #ffe7e7;
            border-left: 4px solid #dc3545;
            color: #dc3545;
        }
        
        .success {
            background: #e7ffe7;
            border-left: 4px solid #28a745;
            color: #28a745;
        }
        
        .loading {
            display: inline-block;
            margin-left: 10px;
        }
        
        .loading::after {
            content: '⏳';
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Test Blockchain Ganache</h1>
        
        <!-- Section 1: Récupérer les comptes -->
        <div class="section">
            <h2>📋 Comptes Ganache</h2>
            <button onclick="loadAccounts()">Charger les comptes</button>
            <div id="accounts-container"></div>
        </div>
        
        <!-- Section 2: Faire une transaction -->
        <div class="section">
            <h2>💸 Envoyer une transaction</h2>
            <div class="transaction-form">
                <div class="form-group">
                    <label>De (Expéditeur):</label>
                    <select id="fromAddress">
                        <option value="">-- Chargez d'abord les comptes --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>À (Destinataire):</label>
                    <select id="toAddress">
                        <option value="">-- Chargez d'abord les comptes --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Montant (ETH):</label>
                    <input type="number" id="amount" placeholder="Ex: 50" step="0.01" min="0">
                </div>
                
                <button onclick="sendTransaction()">Envoyer la transaction</button>
            </div>
            <div id="transaction-result"></div>
        </div>
        
        <!-- Section 3: Vérifier un solde -->
        <div class="section">
            <h2>💰 Vérifier un solde</h2>
            <div class="transaction-form">
                <div class="form-group">
                    <label>Adresse du compte:</label>
                    <select id="balanceAddress">
                        <option value="">-- Chargez d'abord les comptes --</option>
                    </select>
                </div>
                <button onclick="checkBalance()">Vérifier le solde</button>
            </div>
            <div id="balance-result"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:81';
        let accounts = [];

        // Charger tous les comptes
        async function loadAccounts() {
            const container = document.getElementById('accounts-container');
            container.innerHTML = '<div class="loading">Chargement des comptes...</div>';
            
            try {
                const response = await fetch(`${API_URL}/blockchain/accounts`);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Erreur lors du chargement');
                }
                
                accounts = data.accounts;
                
                // Afficher les comptes
                let html = '<div class="accounts-grid">';
                accounts.forEach(account => {
                    html += `
                        <div class="account-card">
                            <div class="account-index">Compte ${account.index}</div>
                            <div class="account-address">${account.address}</div>
                            <div class="account-balance">${parseFloat(account.balanceEth).toFixed(4)} ETH</div>
                        </div>
                    `;
                });
                html += '</div>';
                
                container.innerHTML = html;
                
                // Mettre à jour les selects
                updateSelects();
                
            } catch (error) {
                container.innerHTML = `<div class="result error">❌ Erreur: ${error.message}</div>`;
            }
        }

        // Mettre à jour les listes déroulantes
        function updateSelects() {
            const selects = ['fromAddress', 'toAddress', 'balanceAddress'];
            
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                select.innerHTML = '';
                
                accounts.forEach(account => {
                    const option = document.createElement('option');
                    option.value = account.address;
                    option.textContent = `Compte ${account.index} - ${parseFloat(account.balanceEth).toFixed(4)} ETH`;
                    select.appendChild(option);
                });
            });
        }

        // Envoyer une transaction
        async function sendTransaction() {
            const fromAddress = document.getElementById('fromAddress').value;
            const toAddress = document.getElementById('toAddress').value;
            const amount = document.getElementById('amount').value;
            const resultDiv = document.getElementById('transaction-result');
            
            if (!fromAddress || !toAddress || !amount) {
                resultDiv.innerHTML = '<div class="result error">⚠️ Veuillez remplir tous les champs</div>';
                return;
            }
            
            if (fromAddress === toAddress) {
                resultDiv.innerHTML = '<div class="result error">⚠️ L\'expéditeur et le destinataire doivent être différents</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result">⏳ Envoi de la transaction...</div>';
            
            try {
                const response = await fetch(`${API_URL}/blockchain/transaction`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fromAddress,
                        toAddress,
                        amount: parseFloat(amount)
                    })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Transaction échouée');
                }
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        <strong>✅ Transaction réussie !</strong><br><br>
                        <strong>Hash:</strong> ${data.transactionHash}<br>
                        <strong>Block:</strong> ${data.blockNumber}<br>
                        <strong>Gas utilisé:</strong> ${data.gasUsed}<br><br>
                        <strong>Expéditeur:</strong><br>
                        Avant: ${data.from.balanceBefore} ETH<br>
                        Après: ${data.from.balanceAfter} ETH<br><br>
                        <strong>Destinataire:</strong><br>
                        Avant: ${data.to.balanceBefore} ETH<br>
                        Après: ${data.to.balanceAfter} ETH
                    </div>
                `;
                
                // Recharger les comptes pour voir les nouveaux soldes
                setTimeout(loadAccounts, 1000);
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Erreur: ${error.message}</div>`;
            }
        }

        // Vérifier un solde
        async function checkBalance() {
            const address = document.getElementById('balanceAddress').value;
            const resultDiv = document.getElementById('balance-result');
            
            if (!address) {
                resultDiv.innerHTML = '<div class="result error">⚠️ Veuillez sélectionner un compte</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result">⏳ Récupération du solde...</div>';
            
            try {
                const response = await fetch(`${API_URL}/blockchain/balance/${address}`);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Erreur lors de la récupération');
                }
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        <strong>💰 Solde du compte</strong><br><br>
                        <strong>Adresse:</strong> ${data.address}<br>
                        <strong>Solde:</strong> ${parseFloat(data.balanceEth).toFixed(10)} ETH<br>
                        <strong>Solde (Wei):</strong> ${data.balanceWei} Wei
                    </div>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Erreur: ${error.message}</div>`;
            }
        }

        // Charger les comptes au démarrage
        window.addEventListener('load', () => {
            loadAccounts();
        });
    </script>
</body>
</html>
