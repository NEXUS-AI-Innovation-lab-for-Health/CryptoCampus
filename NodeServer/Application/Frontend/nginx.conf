server {
    listen 80;

    # Proxy all API calls to the api container (inclut /api/socket.io/ : la messagerie
    # temps réel reste sous ce même préfixe déjà proxifié, voir server.js)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        # Requis pour l'upgrade WebSocket (Socket.io) : sans ça, la connexion retombe en
        # HTTP normal et échoue.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Serve the Vue SPA — all other routes
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
