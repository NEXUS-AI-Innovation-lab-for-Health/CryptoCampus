<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../src/favicon.ico">
    <title>Annonces d'Aide aux Devoirs - Test Qdrant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-badge {
            background: #f0f4ff;
            color: #667eea;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .listing-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .listing-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .listing-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .listing-header {
            margin-bottom: 15px;
        }

        .listing-title {
            color: #333;
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .listing-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-subject {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-level {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-price {
            background: #fff3e0;
            color: #e65100;
        }

        .listing-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .listing-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .tutor-name {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }

        .score-badge {
            background: #4caf50;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state-text {
            color: #666;
        }

        @media (max-width: 768px) {
            .listings-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .search-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Annonces d'Aide aux Devoirs</h1>
            <p style="color: #666; margin-bottom: 20px;">Recherchez parmi nos annonces grâce à la recherche sémantique Qdrant</p>
            
            <div class="search-section">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Rechercher par matière, niveau, mots-clés... (ex: 'mathématiques lycée', 'anglais conversation', 'python programmation')"
                    autocomplete="off"
                >
                <button class="btn btn-primary" onclick="searchListings()">🔍 Rechercher</button>
                <button class="btn btn-secondary" onclick="loadAllListings()">📋 Tout afficher</button>
            </div>

            <div class="stats">
                <span class="stat-badge" id="resultCount">0 annonces</span>
                <span class="stat-badge" id="searchStatus">Prêt</span>
            </div>
        </header>

        <div id="errorContainer"></div>
        <div id="loadingContainer"></div>
        <div class="listings-grid" id="listingsContainer"></div>
    </div>

    <script>
        const API_URL = 'http://api_crypto:3000';
        let currentQuery = '';

        // Charger toutes les annonces au démarrage
        window.addEventListener('DOMContentLoaded', () => {
            loadAllListings();
            
            // Recherche en temps réel avec Enter
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchListings();
                }
            });
        });

        // Afficher le chargement
        function showLoading() {
            document.getElementById('loadingContainer').innerHTML = '<div class="loading">⏳ Chargement...</div>';
            document.getElementById('listingsContainer').innerHTML = '';
        }

        // Cacher le chargement
        function hideLoading() {
            document.getElementById('loadingContainer').innerHTML = '';
        }

        // Afficher une erreur
        function showError(message) {
            document.getElementById('errorContainer').innerHTML = `
                <div class="error">
                    ❌ ${message}
                </div>
            `;
            setTimeout(() => {
                document.getElementById('errorContainer').innerHTML = '';
            }, 5000);
        }

        // Charger toutes les annonces
        async function loadAllListings() {
            try {
                showLoading();
                document.getElementById('errorContainer').innerHTML = '';
                document.getElementById('searchStatus').textContent = 'Chargement...';
                
                const response = await fetch(`${API_URL}/listings`);
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                hideLoading();
                currentQuery = '';
                document.getElementById('searchInput').value = '';
                document.getElementById('searchStatus').textContent = 'Toutes les annonces';
                
                displayListings(data.listings, false);
            } catch (error) {
                hideLoading();
                showError(`Impossible de charger les annonces: ${error.message}`);
                document.getElementById('searchStatus').textContent = 'Erreur';
                console.error('Erreur:', error);
            }
        }

        // Rechercher des annonces
        async function searchListings() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                showError('Veuillez entrer un terme de recherche');
                return;
            }

            try {
                showLoading();
                document.getElementById('errorContainer').innerHTML = '';
                document.getElementById('searchStatus').textContent = 'Recherche en cours...';
                currentQuery = query;
                
                const response = await fetch(`${API_URL}/listings/search?q=${encodeURIComponent(query)}&limit=20`);
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                hideLoading();
                document.getElementById('searchStatus').textContent = `Recherche: "${query}"`;
                
                displayListings(data.results, true);
            } catch (error) {
                hideLoading();
                showError(`Erreur de recherche: ${error.message}`);
                document.getElementById('searchStatus').textContent = 'Erreur';
                console.error('Erreur:', error);
            }
        }

        // Afficher les annonces
        function displayListings(listings, showScore = false) {
            const container = document.getElementById('listingsContainer');
            
            if (!listings || listings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">🔍</div>
                        <h2 class="empty-state-title">Aucune annonce trouvée</h2>
                        <p class="empty-state-text">
                            ${currentQuery ? `Aucun résultat pour "${currentQuery}"` : 'La base de données est vide'}
                        </p>
                        ${currentQuery ? '<button class="btn btn-secondary" style="margin-top: 20px;" onclick="loadAllListings()">Afficher toutes les annonces</button>' : ''}
                    </div>
                `;
                document.getElementById('resultCount').textContent = '0 annonces';
                return;
            }

            document.getElementById('resultCount').textContent = `${listings.length} annonce${listings.length > 1 ? 's' : ''}`;
            
            container.innerHTML = listings.map(listing => `
                <div class="listing-card">
                    <div class="listing-header">
                        <h3 class="listing-title">${escapeHtml(listing.title)}</h3>
                        <div class="listing-meta">
                            <span class="badge badge-subject">📚 ${escapeHtml(listing.subject)}</span>
                            <span class="badge badge-level">🎯 ${escapeHtml(listing.level)}</span>
                            <span class="badge badge-price">💰 ${listing.price}€/h</span>
                        </div>
                    </div>
                    <p class="listing-description">${escapeHtml(listing.description)}</p>
                    <div class="listing-footer">
                        <span class="tutor-name">👨‍🏫 ${escapeHtml(listing.tutor_name)}</span>
                        ${showScore && listing.score !== undefined ? 
                            `<span class="score-badge">Score: ${(listing.score * 100).toFixed(0)}%</span>` : 
                            ''}
                    </div>
                </div>
            `).join('');
        }

        // Échapper le HTML pour éviter les XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
